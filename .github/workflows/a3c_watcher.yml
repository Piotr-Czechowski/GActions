# Uruchamia agenta w chmurze GitHuba 2 razy dziennie - komputer może być wyłączony.
name: A3C Watcher

on:
  schedule:
    # Czas UTC. 7:13 i 19:13 UTC = ok. 8:13 i 20:13 w Polsce zimą (latem godzinę później).
    - cron: "13 7,19 * * *"
  workflow_dispatch:   # przycisk "Run workflow" do ręcznego uruchomienia

permissions:
  contents: write      # potrzebne, żeby zapisać state.json (pamięć agenta)

concurrency: a3c-watcher

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Uruchom agenta
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
          WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
          WORKERS_KEYS: ${{ vars.WORKERS_KEYS }}
          REWARD_KEYS: ${{ vars.REWARD_KEYS }}
        run: python agent.py

      - name: Zapisz pamięć agenta (state.json)
        if: always()
        run: |
          git config user.name "a3c-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "Aktualizacja state.json"
          git push
